version: "3.8"

services:
  contract-audit-service:
    build: .
    container_name: contract-audit-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-your-app-password-here}
    networks:
      - contract-network

networks:
  contract-network:
    external: true
